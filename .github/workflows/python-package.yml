name: Testar cadastro de usuários e turma

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Configurar Python 3.9
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'
      - name: Executar testes
        run: python testes.py
