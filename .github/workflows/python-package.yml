name: Testar cadastro de usuários e turma

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Configurar Python 3.9
        uses: actions/setup-python@v7
        with:
          python-version: '3.9.25'
      - name: Executar testes
        run: python testes.py
